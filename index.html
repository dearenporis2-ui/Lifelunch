<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeLaunch</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="boot-screen" id="boot-screen" role="status" aria-live="polite" aria-label="Loading LifeLaunch">
  <div class="boot-glow boot-glow-a" aria-hidden="true"></div><div class="boot-glow boot-glow-b" aria-hidden="true"></div>
  <div class="boot-content">
    <div class="boot-brand"><span class="boot-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M25 5c8 4 13 12 13 22L25 40c-10 0-18-5-22-13L25 5Z" fill="currentColor"/><path d="m17 24 7 7M24 17l7 7" stroke="white" stroke-width="3" stroke-linecap="round"/><circle cx="29" cy="17" r="3" fill="#FFE179"/><path d="m7 32-4 8 9-3" fill="#FF9B6B"/></svg></span><span class="boot-wordmark">LifeLaunch</span></div>
    <span class="boot-tagline">LEARN A LITTLE. GROW A LOT.</span>
    <div class="boot-scene" aria-hidden="true"><span class="boot-star star-a">✦</span><span class="boot-star star-b">✧</span><span class="boot-star star-c">·</span><span class="boot-orbit"></span><span class="boot-planet"></span><span class="boot-rocket">🚀</span></div>
    <h1>Getting your world ready</h1>
    <p id="boot-message">Warming up your sound library…</p>
    <div class="boot-track" role="progressbar" aria-label="Loading LifeLaunch assets" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="boot-progress"></i></div>
    <div class="boot-foot"><span id="boot-count">Preparing your sounds</span><span id="boot-percent">0%</span></div>
    <span class="boot-note">Your progress stays on this device</span>
  </div>
</div>
<a class="skip" href="#view">Skip to content</a>
<header class="hud" id="hud"></header>
<main id="view" tabindex="-1"><p class="lede">Loading LifeLaunch…</p></main>
<div id="toasts" aria-live="polite"></div>
<noscript><style>#boot-screen{display:none}</style><p style="padding:24px">LifeLaunch needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
